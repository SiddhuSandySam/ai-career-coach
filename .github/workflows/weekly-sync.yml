name: Weekly Incremental Skills Sync (0 Read Cost)

on:
  schedule:
    # Runs automatically every Sunday at midnight (Weekly)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  sync-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install firebase-admin

      - name: Create Service Account Key from Secret
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > serviceAccountKey.json

      - name: Run Incremental Sync Engine
        run: node syncSkillsToGit.js

      - name: Commit and Push if New Skills Added
        run: |
          git config --global user.name "AI Career Coach Bot"
          git config --global user.email "bot@aicareercoach.com"
          git add .
          if git diff --staged --quiet; then
            echo "🎉 No new skills or tutorials found in Firestore. 0 unnecessary commits created!"
          else
            git commit -m "chore(auto-sync): auto-synced new skills and tutorials to Git CDN"
            git push
          fi
