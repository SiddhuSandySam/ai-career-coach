name: Auto Daily Question Discussion Poster

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  post-daily-question:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install firebase-admin

      - name: Create Service Account Key from Secret
        env:
          KEY_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          KEY_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$KEY_1" ]; then
            echo "$KEY_1" > serviceAccountKey.json
          elif [ -n "$KEY_2" ]; then
            echo "$KEY_2" > serviceAccountKey.json
          else
            echo "❌ Neither FIREBASE_SERVICE_ACCOUNT_KEY nor FIREBASE_SERVICE_ACCOUNT secret was found!"
            exit 1
          fi

      - name: Run Daily Question Poster
        run: node postDailyQuestion.js
